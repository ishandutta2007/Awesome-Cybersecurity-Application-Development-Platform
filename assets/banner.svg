<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050814"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#7928ca"/><stop offset="100%" stop-color="#ff0080"/></linearGradient><linearGradient id="shieldGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="50%" stop-color="#4facfe" stop-opacity=".4"/><stop offset="100%" stop-color="#7928ca" stop-opacity=".1"/></linearGradient><filter id="glowCyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glowPurple" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".8" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.18) translate(-15px,10px);opacity:.65}}@keyframes scanline{0%{transform:translateY(-420px)}}@keyframes floatBadge{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}.orb1{animation:pulseOrb 8s ease-in-out infinite alternate;transform-origin:200px 100px}.orb2{animation:pulseOrb 10s ease-in-out infinite alternate-reverse;transform-origin:1000px 300px}.stream-line{stroke-dasharray:8,12;animation:dashMove 4s linear infinite}.radar-sweep{tran