th="280" height="28" x="0" y="0" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity=".9" rx="14"/><circle cx="14" cy="14" r="5" fill="#00f2fe" filter="url(#glowCyan)"/><text x="28" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">DEVSECOPS &amp; SOAR ECOSYSTEM</text></g><text x="0" y="160" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-.5" transform="translate(260, 0)">Awesome Cybersecurity</text><text x="0" y="210" fill="url(#accentCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-.5" transform="translate(260, 0)">App Development Platform</text><text x="0" y="252" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" transform="translate(260, 0)">Curated index of Security App Marketplaces, Serverless FaaS, Low-Code Automation &amp; Self-Hosted SOAR</text><g><g class="pill1" transform="translate(260, 0) translate(0, 290) translate(0, 0)"><rect width="135" height="36" fill="#111827" stroke="#00f2fe" stroke-width="1.2" opacity=".95" rx="18"/><text x="67" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">🛡️ Native FaaS</text></g><g class="pill2" transform="translate(260, 0) translate(0, 290) translate(148, 0)"><rect width="155" height="36" fill="#111827" stroke="#38bdf8" stroke-width="1.2" opacity=".95" rx="18"/><text x="77" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">⚡ Low-Code SOAR</text></g><g class="pill3" transform="translate(260