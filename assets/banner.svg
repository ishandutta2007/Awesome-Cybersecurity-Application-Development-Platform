<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(-15px, 10px); opacity: 0.65; }
    }
    @keyframes scanline {
      0% { transform: translateY(-420px); }
      100% { transform: translateY(420px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .orb1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 1000px 300px; }
    .scanner { animation: scanline 7s linear infinite; }
    .stream-line { stroke-dasharray: 8, 12; animation: dashMove 4s linear infinite; }
    .radar-sweep { transform-origin: 1050px 120px; animation: radarSpin 12s linear infinite; }
    .pill1 { animation: floatBadge 4s ease-in-out infinite; }
    .pill2 { animation: floatBadge 5s ease-in-out infinite 0.7s; }
    .pill3 { animation: floatBadge 4.5s ease-in-out infinite 1.4s; }
    .pill4 { animation: floatBadge 5.2s ease-in-out infinite 2.1s; }
  </style>

  <!-- 1. Background base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- 2. Cyber Grid overlay -->
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- 3. Dynamic background glowing orbs -->
  <circle class="orb1" cx="220" cy="100" r="140" fill="#00f2fe" opacity="0.3" filter="url(#glowCyan)" />
  <circle class="orb2" cx="1020" cy="310" r="180" fill="#7928ca" opacity="0.25" filter="url(#glowPurple)" />

  <!-- 4. Circuit & Data streams in background -->
  <g opacity="0.35">
    <path class="stream-line" d="M 0,90 L 350,90 L 420,160 L 800,160" fill="none" stroke="#00f2fe" stroke-width="2" />
    <path class="stream-line" d="M 1200,340 L 950,340 L 880,270 L 500,270" fill="none" stroke="#ff0080" stroke-width="2" />
    <circle cx="420" cy="160" r="4" fill="#00f2fe" />
    <circle cx="880" cy="270" r="4" fill="#ff0080" />
  </g>

  <!-- 5. Dynamic Radar Scan Element (top-right background) -->
  <g opacity="0.4">
    <circle cx="1050" cy="120" r="70" fill="none" stroke="#334155" stroke-width="1.5" />
    <circle cx="1050" cy="120" r="45" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <circle cx="1050" cy="120" r="20" fill="none" stroke="#00f2fe" stroke-width="1" />
    <g class="radar-sweep">
      <line x1="1050" y1="120" x2="1120" y2="120" stroke="url(#accentCyan)" stroke-width="2" filter="url(#glowCyan)" />
    </g>
  </g>

  <!-- 6. Stylized Cybersecurity Shield Icon (left side foreground accent) -->
  <g transform="translate(90, 110)">
    <!-- Outer Shield Glow -->
    <path d="M 70,10 L 130,32 L 130,95 C 130,135 70,170 70,170 C 70,170 10,135 10,95 L 10,32 Z" 
          fill="url(#shieldGrad)" stroke="#00f2fe" stroke-width="2.5" filter="url(#glowCyan)" opacity="0.9" />
    <!-- Inner Lock Symbol -->
    <rect x="52" y="85" width="36" height="28" rx="5" fill="#0a0f1d" stroke="#00f2fe" stroke-width="2" />
    <path d="M 60,85 L 60,70 C 60,61 80,61 80,70 L 80,85" fill="none" stroke="#00f2fe" stroke-width="2" />
    <circle cx="70" cy="97" r="3" fill="#00f2fe" />
    <line x1="70" y1="100" x2="70" y2="106" stroke="#00f2fe" stroke-width="2" />
  </g>

  <!-- 7. Foreground Text (Strictly on top, crystal clear & prominent) -->
  <g transform="translate(260, 0)">
    <!-- Top Category Pill / Tag -->
    <g transform="translate(0, 82)">
      <rect x="0" y="0" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
      <circle cx="14" cy="14" r="5" fill="#00f2fe" filter="url(#glowCyan)" />
      <text x="28" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
        DEVSECOPS &amp; SOAR ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="160" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Cybersecurity
    </text>
    <text x="0" y="210" fill="url(#accentCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      App Development Platform
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="252" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      Curated index of Security App Marketplaces, Serverless FaaS, Low-Code Automation &amp; Self-Hosted SOAR
    </text>

    <!-- Animated Feature Badges (Bottom Row) -->
    <g transform="translate(0, 290)">
      <g class="pill1" transform="translate(0, 0)">
        <rect width="135" height="36" rx="18" fill="#111827" stroke="#00f2fe" stroke-width="1.2" opacity="0.95" />
        <text x="67" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">🛡️ Native FaaS</text>
      </g>
      <g class="pill2" transform="translate(148, 0)">
        <rect width="155" height="36" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
        <text x="77" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">⚡ Low-Code SOAR</text>
      </g>
      <g class="pill3" transform="translate(315, 0)">
        <rect width="165" height="36" rx="18" fill="#111827" stroke="#a855f7" stroke-width="1.2" opacity="0.95" />
        <text x="82" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">🤖 AI Agent Triage</text>
      </g>
      <g class="pill4" transform="translate(492, 0)">
        <rect width="180" height="36" rx="18" fill="#111827" stroke="#ec4899" stroke-width="1.2" opacity="0.95" />
        <text x="90" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">🌐 Open-Source Stacks</text>
      </g>
    </g>
  </g>

  <!-- 8. Subtle Outer Border -->
  <rect x="1" y="1" width="1198" height="418" rx="8" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />
</svg>
